<div style="max-width: 500px">
  <h3 class="mb-3">{{ productoId() ? 'Editar producto' : 'Nuevo producto' }}</h3>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" formControlName="nombre" />
      @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
        <div class="form-text text-danger">El nombre debe tener al menos 3 caracteres.</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label">Categoría</label>
      <select class="form-select" formControlName="categoria">
        @for (categoria of categorias; track categoria) {
          <option [value]="categoria">{{ categoria }}</option>
        }
      </select>
    </div>

    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Precio regular</label>
        <input type="number" step="0.01" class="form-control" formControlName="precioRegular" />
      </div>
      <div class="col mb-3">
        <label class="form-label">Precio oferta</label>
        <input type="number" step="0.01" class="form-control" formControlName="precioOferta" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input type="number" class="form-control" formControlName="stock" />
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="esPrime" formControlName="esPrime" />
      <label class="form-check-label" for="esPrime">Producto Prime (preparado al momento)</label>
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2">{{ error() }}</div>
    }

    <button type="submit" class="btn btn-danger" [disabled]="enviando()">
      {{ enviando() ? 'Guardando...' : 'Guardar producto' }}
    </button>
  </form>
</div>
