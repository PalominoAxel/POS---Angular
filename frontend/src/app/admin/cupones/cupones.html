<div>
  <h3 class="mb-3">Cupones válidos</h3>
  <p class="text-muted small">Estos son los códigos de cupón que los cajeros pueden aplicar en una venta.</p>

  @if (cargando()) {
    <p>Cargando...</p>
  } @else {
    <table class="table table-striped" style="max-width: 400px">
      <thead>
        <tr>
          <th>Código</th>
          <th>Descuento</th>
        </tr>
      </thead>
      <tbody>
        @for (cupon of cupones(); track cupon.id) {
          <tr>
            <td class="fw-semibold">{{ cupon.codigo }}</td>
            <td>{{ cupon.montoDescuento | precioSoles }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted">No hay cupones activos.</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
