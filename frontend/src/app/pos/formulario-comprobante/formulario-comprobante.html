<div [formGroup]="form">
  <label class="form-label small fw-semibold">Tipo de comprobante</label>
  <select class="form-select mb-2" formControlName="tipoComprobante" (change)="onTipoComprobanteChange()">
    <option value="BOLETA">Boleta</option>
    <option value="FACTURA">Factura</option>
  </select>

  @if (controls.tipoComprobante.value === 'BOLETA') {
    <div class="mb-2">
      <label class="form-label small">Documento del cliente</label>
      <select class="form-select form-select-sm mb-1" formControlName="tipoDocumento" (change)="onTipoDocumentoChange()">
        <option value="SIN_DOC">Sin documento (Cliente Varios)</option>
        <option value="DNI">DNI</option>
        <option value="CE">Carné de Extranjería</option>
      </select>

      @if (controls.tipoDocumento.value !== 'SIN_DOC') {
        <input
          class="form-control form-control-sm"
          [class.is-invalid]="controls.numeroDocumento.invalid && controls.numeroDocumento.touched"
          [placeholder]="controls.tipoDocumento.value === 'DNI' ? 'Ej: 72839401' : 'Ej: 001234567'"
          inputmode="numeric"
          [attr.maxlength]="maxLengthDocumento()"
          formControlName="numeroDocumento"
          (input)="onNumeroDocumentoInput($any($event.target).value)"
          (keydown)="bloquearNoNumerico($event)"
        />
      }
    </div>
  } @else {
    <div class="mb-2">
      <label class="form-label small">RUC</label>
      <input
        class="form-control form-control-sm mb-1"
        [class.is-invalid]="controls.ruc.invalid && controls.ruc.touched"
        placeholder="11 dígitos"
        inputmode="numeric"
        maxlength="11"
        formControlName="ruc"
        (input)="onRucInput($any($event.target).value)"
        (keydown)="bloquearNoNumerico($event)"
      />
      <label class="form-label small">Razón Social</label>
      <input
        class="form-control form-control-sm"
        [class.is-invalid]="controls.razonSocial.invalid && controls.razonSocial.touched"
        formControlName="razonSocial"
      />
    </div>
  }

  @if (error()) {
    <div class="alert alert-danger py-1 px-2 small mb-0">{{ error() }}</div>
  }
</div>
