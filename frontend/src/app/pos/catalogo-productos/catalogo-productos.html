<div>
  <div class="mb-3 d-flex flex-wrap gap-2">
    <select class="form-select" style="max-width: 260px" [value]="categoriaSeleccionada()" (change)="categoriaSeleccionada.set($any($event.target).value)">
      <option value="TODAS">Todas las categorías</option>
      @for (categoria of categorias(); track categoria.id) {
        <option [value]="categoria.nombre">{{ categoria.nombre }}</option>
      }
    </select>
    <div class="input-group" style="max-width: 320px">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input
        type="search"
        class="form-control"
        placeholder="Buscar producto por nombre o código..."
        [value]="busqueda()"
        (input)="onBusquedaInput($any($event.target).value)"
      />
    </div>
  </div>

  @if (cargando()) {
    <p class="text-muted">Cargando catálogo...</p>
  } @else {
    <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3">
      @for (producto of productosFiltrados(); track producto.id) {
        <div class="col">
          <app-tarjeta-producto [producto]="producto" />
        </div>
      } @empty {
        <p class="text-muted">No hay productos en esta categoría.</p>
      }
    </div>
  }
</div>
