<div class="login-page d-flex align-items-center justify-content-center min-vh-100 bg-dark">
  <div class="card shadow-sm" style="width: 360px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="fs-3 fw-bold text-danger">TAMBO</div>
        <div class="text-muted">Tienda de Conveniencia · POS</div>
      </div>

      <form [formGroup]="form" (ngSubmit)="ingresar()">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" formControlName="nombreUsuario" autocomplete="username" />
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" formControlName="password" autocomplete="current-password" />
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-danger w-100" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>
  </div>
</div>
